<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carseph Notes</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">Carseph Notes</a>
  <nav id="mainnav" hidden>
    <a href="/" data-nav="notes">Notes</a>
    <a href="/files" data-nav="files">Files</a>
    <a href="/settings" data-nav="settings">Settings</a>
    <button id="btn-logout" class="linklike">Sign out</button>
  </nav>
</header>

<main id="view">
  <section id="page-notes" class="page notes-page" hidden>
    <div class="notes-layout">
      <aside class="sidebar">
        <input id="search" type="text" placeholder="Search titles…" class="search-box">
        <div class="side-section">
          <h4>Folders</h4>
          <ul id="folder-list" class="side-list"></ul>
          <form id="folder-form" class="inline-form">
            <input id="folder-name" type="text" placeholder="New folder">
            <button type="submit" class="mini">+</button>
          </form>
        </div>
        <div class="side-section">
          <h4>Tags</h4>
          <ul id="tag-list" class="side-list"></ul>
        </div>
      </aside>

      <div class="note-list-col">
        <div class="list-head">
          <span id="list-title">All notes</span>
          <button id="btn-new-note" class="mini">New note</button>
        </div>
        <ul id="note-list" class="note-list"></ul>
      </div>

      <div class="editor-pane" id="editor-pane" hidden>
        <div class="editor-toolbar">
          <input id="note-title" type="text" placeholder="Title">
          <select id="note-folder" class="mini-select"><option value="">Unfiled</option></select>
          <input id="note-tags" type="text" placeholder="tags, comma,separated" class="tags-input">
          <button id="btn-save" class="mini primary">Save</button>
          <button id="btn-delete" class="mini danger">Delete</button>
        </div>
        <div class="editor-split">
          <textarea id="note-body" placeholder="Write Markdown here…" spellcheck="false"></textarea>
          <div id="preview" class="preview md-body"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="page-files" class="page" hidden>
    <div class="empty-state">
      <h2>Files</h2>
      <p class="muted">Image &amp; PDF management arrives in milestone M3.</p>
    </div>
  </section>

  <section id="page-settings" class="page" hidden>
    <h2>Account</h2>
    <p>Signed in as <strong id="whoami">…</strong></p>

    <h3>Passkeys</h3>
    <table class="pk-table" id="pk-table">
      <thead><tr><th>Name</th><th>Created</th><th>Last used</th><th></th></tr></thead>
      <tbody id="pk-rows"></tbody>
    </table>
    <div class="btn-row">
      <button id="btn-add-passkey">Add passkey</button>
    </div>
  </section>
</main>

<p id="msg" class="msg" role="alert"></p>
<script src="/static/vendor/marked.umd.min.js"></script>
<script src="/static/vendor/dompurify.min.js"></script>
<script src="/static/vendor/simplewebauthn.umd.min.js"></script>
<script type="module" src="/static/app.js"></script>
</body>
</html>
