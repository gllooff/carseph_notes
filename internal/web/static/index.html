<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carseph Notes</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">Carseph Notes</a>
  <nav id="mainnav" hidden>
    <a href="/" data-nav="notes">Notes</a>
    <a href="/settings" data-nav="settings">Settings</a>
    <span id="nav-user" class="nav-user"></span>
    <button id="btn-logout" class="linklike">Sign out</button>
  </nav>
</header>

<main id="view">
  <section id="page-notes" class="page notes-page" hidden>
    <div class="notes-layout">
      <aside class="sidebar">
        <input id="search" type="text" placeholder="Search titles…" class="search-box">
        <div class="side-section">
          <h4>Folders</h4>
          <ul id="folder-list" class="side-list"></ul>
          <form id="folder-form" class="inline-form">
            <input id="folder-name" type="text" placeholder="New folder">
            <button type="submit" class="mini">+</button>
          </form>
        </div>
        <div class="side-section">
          <h4>Tags</h4>
          <ul id="tag-list" class="side-list"></ul>
        </div>
      </aside>

      <div class="note-list-col">
        <div class="list-head">
          <span id="list-title">All notes</span>
          <button id="btn-new-note" class="mini">New note</button>
        </div>
        <ul id="note-list" class="note-list"></ul>
      </div>
    </div>
  </section>

  <section id="page-settings" class="page" hidden>
    <h2>Account</h2>
    <p>Signed in as <strong id="whoami">…</strong></p>

    <h3>Passkeys</h3>
    <table class="pk-table" id="pk-table">
      <thead><tr><th>Name</th><th>Created</th><th>Last used</th><th></th></tr></thead>
      <tbody id="pk-rows"></tbody>
    </table>
    <div class="btn-row">
      <button id="btn-add-passkey">Add passkey</button>
    </div>
  </section>

  <input id="file-input" type="file" accept=".png,.jpg,.jpeg,.gif,.webp,.avif,.pdf" hidden>

  <div id="viewer-overlay" class="viewer-overlay" hidden>
    <div class="viewer-bar">
      <span id="viewer-name"></span>
      <div class="viewer-actions" id="viewer-actions">
        <div class="va-row" id="va-file-actions">
          <button id="viewer-delete" class="mini danger">Delete</button>
          <button id="viewer-close" class="mini">Close</button>
        </div>
        <div class="va-row" id="va-zoom">
          <button id="viewer-zoom-out" class="mini" title="Zoom out" hidden>−</button>
          <span id="viewer-zoom-label" class="mini-label" hidden>100%</span>
          <button id="viewer-zoom-in" class="mini" title="Zoom in" hidden>+</button>
          <button id="viewer-img-fit" class="mini" title="Reset zoom and rotation" hidden>Fit</button>
        </div>
        <div class="va-row" id="va-rotate">
          <button id="viewer-rotate-left" class="mini" title="Rotate left" hidden>⟲</button>
          <button id="viewer-rotate-right" class="mini" title="Rotate right" hidden>⟳</button>
          <button id="viewer-save-rot" class="mini primary" title="Save rotation" hidden>Save</button>
        </div>
        <div class="va-row" id="va-pdf-zoom" hidden>
          <button id="pdf-prev" class="mini" title="Previous page">‹</button>
          <span id="pdf-page-label" class="mini-label">1 / 1</span>
          <button id="pdf-next" class="mini" title="Next page">›</button>
          <button id="pdf-zoom-out" class="mini" title="Zoom out">−</button>
          <span id="pdf-zoom-label" class="mini-label">100%</span>
          <button id="pdf-zoom-in" class="mini" title="Zoom in">+</button>
          <button id="pdf-zoom-fit" class="mini" title="Fit to screen">Fit</button>
        </div>
      </div>
    </div>
    <img id="viewer-img" alt="">
    <canvas id="viewer-pdf" hidden></canvas>
  </div>
</main>

<p id="msg" class="msg" role="alert"></p>
<script src="/static/vendor/marked.umd.min.js"></script>
<script src="/static/vendor/dompurify.min.js"></script>
<script src="/static/vendor/simplewebauthn.umd.min.js"></script>
<script type="module" src="/static/app.js"></script>
<script type="module" src="/static/files.js"></script>
</body>
</html>
